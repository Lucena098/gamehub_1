{% extends "base.html" %}

{% block title %}
Login - GameHub
{% endblock %}

{% block content %}

<h1>🎮 Login</h1>

<form action="{{ url_for('main.login') }}" method="POST">

    <label for="email">Email:</label>
    <br>

    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <br><br>

    <label for="password">Senha:</label>
    <br>

    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <br><br>

    <button type="submit">
        Entrar
    </button>

</form>

<br>

<a href="{{ url_for('main.register') }}">
    Ainda não tenho uma conta
</a>

{% endblock %}
